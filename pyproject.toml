[project]
name = "vless-shopbot-rixxx-edition"
version = "2.1.0"
requires-python = ">=3.11,<3.15"
description = "Бот для автоматической продажи VLESS VPN"
dependencies = [
    "aiogram==3.31.0",
    "flask==3.1.3",
    "waitress==3.0.2",
    "pyotp==2.9.0",
    "python-dotenv==1.2.4",
    "qrcode[pil]==8.2",
    "yookassa==3.5.0",
    "aiohttp==3.14.4",
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pylint",
    "black"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shop_bot = ["webhook_server/templates/*.html", "webhook_server/static/css/*", "webhook_server/static/js/*", "webhook_server/static/img/*"]
