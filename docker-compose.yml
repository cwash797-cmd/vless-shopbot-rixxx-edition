services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEBHOOK_HOST: 0.0.0.0
      DATABASE_PATH: /app/project/users.db
    ports:
      - '127.0.0.1:1488:1488'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - .:/app/project
